version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blp-backend
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    expose:
      - "8000"
    networks:
      - blp-network
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blp-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://backend:8000
    networks:
      - blp-network
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: blp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - blp-network

  redis:
    image: redis:7-alpine
    container_name: blp-redis
    expose:
      - "6379"
    networks:
      - blp-network

  caddy:
    image: caddy:2-alpine
    container_name: blp-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - blp-network

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  blp-network:
    driver: bridge
